{{define "case-head"}}
<section class="case-head">
  <div class="case-title">
    <div class="eyebrow-line">
      <span class="eyebrow">SOURCE INSPECTION</span>
      <span class="status-badge {{statusClass .Check.Status}}"><span></span>{{statusLabel .Check.Status}}</span>
      {{if .Check.HumanVerdict}}<span class="status-badge human"><svg viewBox="0 0 12 12" fill="none"><path d="m2.5 6 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>{{.Check.HumanLabel}}</span>{{end}}
    </div>
    <h1>日志注入检测 <span>·</span> 来源检查</h1>
    <p class="case-subtitle">{{.Check.Title}}</p>
    <div class="case-meta-row">
      <span class="meta-item">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 4.2h10v7.6H3zM5.3 4.2V2.8h5.4v1.4M5.4 7h5.2M5.4 9.6h3.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        {{.Check.Source}}
      </span>
      <span class="meta-item">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v3.2l2 1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        {{fmtTime .Check.CreatedAt}} 接收
      </span>
      <span class="meta-item mono">{{.Check.ID}}</span>
    </div>
  </div>
  <div class="case-actions">
    <button class="button ghost" id="copy-link">
      <svg viewBox="0 0 18 18" fill="none"><path d="M7 6.4V4.8c0-1 .8-1.8 1.8-1.8h4.4c1 0 1.8.8 1.8 1.8v4.4c0 1-.8 1.8-1.8 1.8h-1.6M4.8 6.4h4.4c1 0 1.8.8 1.8 1.8v4.4c0 1-.8 1.8-1.8 1.8H4.8c-1 0-1.8-.8-1.8-1.8V8.2c0-1 .8-1.8 1.8-1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      复制链接
    </button>
    <a class="button ghost" href="/checks/{{.Check.ID}}/export">
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 2.8v8.4M5.8 8.2 9 11.5l3.2-3.3M3.2 12.5v2.3h11.6v-2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      导出证据包
    </a>
    <button class="button primary" data-open-modal="new-check">
      <svg viewBox="0 0 18 18" fill="none"><path d="M9 3.5v11M3.5 9h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      新建检查
    </button>
  </div>
</section>
{{end}}
