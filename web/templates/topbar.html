{{define "topbar"}}
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-button mobile-menu" id="menu-toggle" aria-label="打开导航">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="breadcrumb">
      <a href="/">检查台</a>
      <span>/</span>
      <span>来源检查</span>
      <span>/</span>
      <strong>{{.Check.ID}}</strong>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="command-search">
      <svg viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="m11.4 11.4 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>搜索检查、证据或哈希</span>
      <kbd>⌘ K</kbd>
    </div>
    <button class="icon-button" aria-label="帮助">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M8.2 7.9a1.9 1.9 0 1 1 3 1.55c-.7.52-1.2.9-1.2 1.75M10 13.9v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="topbar-divider"></div>
    <span class="sync-state"><span class="status-dot"></span> 已同步</span>
    <span class="tiny-avatar">周</span>
  </div>
</header>
{{end}}
